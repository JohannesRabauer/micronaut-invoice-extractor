micronaut.application.name=invoice-extractor
micronaut.server.multipart.max-file-size=10MB

# Ollama. Gemma 3 (4B) takes text and images.
# base-url is not set here on purpose: Micronaut test-resources start an Ollama container for mn:run
# and for tests and fill it in. In compose it comes from the environment (LANGCHAIN4J_OLLAMA_BASE_URL).
# The test resource reads langchain4j.ollama.model-name to pick its image (langchain4j/ollama-<name>).
langchain4j.ollama.model-name=gemma3
langchain4j.ollama.chat-model.base-url=${langchain4j.ollama.base-url}
langchain4j.ollama.chat-model.model-name=${langchain4j.ollama.model-name}
langchain4j.ollama.chat-model.temperature=0.0
# Ollama's default context is small; invoices as text need more
langchain4j.ollama.chat-model.num-ctx=8192
langchain4j.ollama.chat-model.supported-capabilities=RESPONSE_FORMAT_JSON_SCHEMA
langchain4j.ollama.chat-model.timeout=10m
langchain4j.ollama.chat-model.log-requests=false
langchain4j.ollama.chat-model.log-responses=true

# static upload page at /
micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.mapping=/**
micronaut.router.static-resources.default.paths=classpath:static
