micronaut.application.name=invoice-extractor
micronaut.server.multipart.max-file-size=10MB

# llama-server speaks the OpenAI API, so the OpenAI module talks to it. The model is whatever
# llama-server was started with; the name and the key only have to be non-empty.
langchain4j.open-ai.base-url=${LLM_URL:`http://localhost:8081/v1`}
langchain4j.open-ai.api-key=not-needed
langchain4j.open-ai.chat-model.model-name=local
langchain4j.open-ai.chat-model.temperature=0.0
langchain4j.open-ai.chat-model.timeout=10m
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=true
