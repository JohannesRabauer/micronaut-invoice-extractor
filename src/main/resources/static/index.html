<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice extractor</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
  #drop { border: 2px dashed #999; border-radius: 8px; padding: 2rem; text-align: center; color: #555; cursor: pointer; }
  #drop.over { border-color: #07c; background: #eef6ff; color: #07c; }
  .warn { color: #a40; }
  .ok { color: #070; }
</style>
</head>
<body>
<h1>Invoice extractor</h1>
<p>Upload a PDF invoice or a receipt image (.png, .jpg). A local model reads it.</p>
<div id="drop">Drop a file here, or click to choose one</div>
<input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg" hidden>
<img id="preview" alt="" style="display:none; max-height: 16rem; margin-top: 1rem">
<p id="status"></p>
<div id="warnings"></div>
<pre id="out"></pre>
<script>
const drop = document.getElementById('drop');
const input = document.getElementById('file');
const status = document.getElementById('status');

drop.onclick = () => input.click();
input.onchange = () => input.files[0] && extract(input.files[0]);
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => e.dataTransfer.files[0] && extract(e.dataTransfer.files[0]));
// a dropped file outside the box must not make the browser open it
['dragover', 'drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));

async function extract(f) {
  const preview = document.getElementById('preview');
  preview.style.display = f.type.startsWith('image/') ? 'block' : 'none';
  if (f.type.startsWith('image/')) preview.src = URL.createObjectURL(f);
  status.textContent = 'Reading ' + f.name + ' ...';
  document.getElementById('out').textContent = '';
  document.getElementById('warnings').innerHTML = '';
  const body = new FormData();
  body.append('file', f);
  try {
    const res = await fetch('/extract', { method: 'POST', body });
    const json = await res.json();
    status.textContent = res.ok ? f.name + ': done in ' + (json.millis / 1000).toFixed(1) + ' s (' + json.source + ')' : 'Error ' + res.status;
    const w = json.warnings || [];
    document.getElementById('warnings').innerHTML = w.length
      ? '<p class="warn"><b>Needs a human look:</b></p><ul>' + w.map(x => '<li class="warn">' + x.replace(/</g, '&lt;') + '</li>').join('') + '</ul>'
      : (res.ok ? '<p class="ok">Numbers add up.</p>' : '');
    document.getElementById('out').textContent = JSON.stringify(json.invoice || json, null, 2);
  } catch (e) {
    status.textContent = 'Failed: ' + e;
  }
  input.value = '';
}
</script>
</body>
</html>
