# CPU version, works everywhere (slow). For an NVIDIA GPU use:
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # -hf downloads the model (and its vision projector) from Hugging Face on first start,
    # into the llm-cache volume. Gemma 3 4B takes text and images.
    command: >
      -hf ggml-org/gemma-3-4b-it-GGUF
      --host 0.0.0.0 --port 8080
      -c 8192
    ports:
      - "18081:8080"
    volumes:
      - llm-cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s

  app:
    build: .
    environment:
      LLM_URL: http://llm:8080/v1
    ports:
      - "8080:8080"
    depends_on:
      llm:
        condition: service_healthy

volumes:
  llm-cache:
