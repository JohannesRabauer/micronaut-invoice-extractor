# CPU version, works everywhere (slow). For an NVIDIA GPU use:
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
services:
  llm:
    # Ollama with Gemma 3 (text and images) baked in, see ollama/Dockerfile. The image name is the one
    # Micronaut test-resources expect, so mn:run finds the same image.
    build: ollama
    image: langchain4j/ollama-gemma3:latest
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q gemma3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    build: .
    environment:
      LANGCHAIN4J_OLLAMA_BASE_URL: http://llm:11434
    ports:
      - "8080:8080"
    depends_on:
      llm:
        condition: service_healthy

  # helper programs, only started on request: docker compose --profile tools run --rm generate
  generate:
    profiles: [tools]
    build:
      context: .
      target: tools
    entrypoint: ["java", "-Djava.awt.headless=true", "-cp", "app.jar", "example.tools.GenerateSamples", "/samples"]
    volumes:
      - ./samples:/samples

  # docker compose --profile tools run --rm evaluate [filter]   (needs the stack to be up)
  evaluate:
    profiles: [tools]
    build:
      context: .
      target: tools
    entrypoint: ["java", "-cp", "app.jar", "example.tools.Evaluate", "/samples"]
    environment:
      APP_URL: http://app:8080/extract
    volumes:
      - ./samples:/samples:ro
