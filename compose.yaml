# CPU version, works everywhere (slow). For an NVIDIA GPU use:
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # -hf downloads the model (and its vision projector) from Hugging Face on first start,
    # into the llm-cache volume. Gemma 3 4B takes text and images.
    command: >
      -hf ggml-org/gemma-3-4b-it-GGUF
      --host 0.0.0.0 --port 8080
      -c 8192
    ports:
      - "18081:8080"
    volumes:
      - llm-cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s

  app:
    build: .
    environment:
      LLM_URL: http://llm:8080/v1
    ports:
      - "8080:8080"
    depends_on:
      llm:
        condition: service_healthy

  # helper programs, only started on request: docker compose --profile tools run --rm generate
  generate:
    profiles: [tools]
    build:
      context: .
      target: tools
    entrypoint: ["java", "-Djava.awt.headless=true", "-cp", "app.jar", "example.tools.GenerateSamples", "/samples"]
    volumes:
      - ./samples:/samples

  # docker compose --profile tools run --rm evaluate [filter]   (needs the stack to be up)
  evaluate:
    profiles: [tools]
    build:
      context: .
      target: tools
    entrypoint: ["java", "-cp", "app.jar", "example.tools.Evaluate", "/samples"]
    environment:
      APP_URL: http://app:8080/extract
    volumes:
      - ./samples:/samples:ro

volumes:
  llm-cache:
